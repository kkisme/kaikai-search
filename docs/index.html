<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176a64"><title>凯凯搜题助手</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"></head>
<body>
<header id="header"><div class="brand"><span>凯凯搜题助手</span><small>交安复习 · 完整题目阅读</small></div>
<form id="searchForm" role="search"><label class="sr-only" for="searchInput">搜索题目、选项或案例背景</label><input id="searchInput" type="search" placeholder="搜索题干、选项、案例 / 拼音" autocomplete="off"><button type="submit">搜索</button></form>
<nav id="typeFilters" aria-label="题型筛选"></nav></header>
<main><div class="result-bar"><p id="stat" role="status">正在加载最新题库…</p><label><input type="checkbox" id="showAnswers" checked> 展开答案</label></div><div id="list"></div><button id="more" hidden>继续加载</button><p class="footer">按核对版文档整理 · 案例背景与小题完整保留</p></main>
<aside id="matchNav" hidden aria-label="搜索关键词定位"><button id="prevMatch" aria-label="上一个关键词">↑</button><output id="matchCount" aria-live="polite">0 / 0</output><button id="nextMatch" aria-label="下一个关键词">↓</button></aside>
<script type="module" src="app.js"></script></body></html>
