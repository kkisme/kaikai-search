<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>凯凯搜题助手</title>
  <meta name="theme-color" content="#1989fa">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f8fa; color: #323233;
    }
    header {
      position: sticky; top: 0; z-index: 10; background: #1989fa; color: #fff; padding: 12px 12px 8px;
    }
    header h1 { font-size: 18px; margin: 0 0 10px; text-align: center; }
    .search-wrap { display: flex; gap: 8px; background: #fff; border-radius: 20px; padding: 4px 6px 4px 14px; }
    .search-wrap input {
      flex: 1; border: 0; outline: 0; height: 34px; font-size: 15px; background: transparent;
    }
    .search-wrap button {
      border: 0; background: #1989fa; color: #fff; border-radius: 16px; padding: 0 14px; font-size: 14px;
    }
    .filters {
      white-space: nowrap; overflow-x: auto; overflow-y: hidden;
      padding: 10px 12px 2px; margin: 0 -12px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      display: inline-block; white-space: nowrap; margin-right: 6px;
      background: rgba(255,255,255,.2); color: #fff; border-radius: 14px;
      padding: 5px 12px; font-size: 13px; border: 0; cursor: pointer;
    }
    .chip.active { background: #fff; color: #1989fa; font-weight: bold; }
    main { padding: 10px 10px 80px; max-width: 640px; margin: 0 auto; }
    .stat { color: #969799; font-size: 12px; padding: 4px 4px 10px; }
    .card {
      background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .type-tag {
      font-size: 11px; color: #1989fa; border: 1px solid #d5e7fb; background: #ecf5ff;
      padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    }
    .q-text { font-size: 15px; line-height: 1.6; margin-top: 6px; }
    .q-text mark { background: #ffe58f; color: inherit; border-radius: 2px; padding: 0 1px; }
    .options { margin-top: 8px; font-size: 14px; line-height: 1.7; color: #4b4b4b; }
    .answer-card {
      margin-top: 8px; background: #f0f9eb; border-left: 3px solid #67c23a; padding: 8px 10px;
      font-size: 14px; border-radius: 6px;
    }
    .note { margin-top: 6px; font-size: 12px; color: #969799; }
    .case-card { border-left: 4px solid #b37feb; }
    .case-title { font-size: 16px; font-weight: bold; margin-top: 6px; }
    .case-material {
      margin-top: 6px; font-size: 13px; color: #646566; line-height: 1.7;
      background: #f7f3fc; padding: 8px 10px; border-radius: 6px;
    }
    .sub-card { border-left: 3px solid #ebeef5; margin: 10px 0 0 4px !important; box-shadow: none; }
    .empty { text-align: center; color: #969799; padding: 60px 20px; font-size: 14px; }
    .footer { text-align: center; color: #969799; font-size: 12px; padding: 20px 0 30px; }
  </style>
</head>
<body>
  <header>
    <h1>凯凯搜题助手</h1>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="输入关键词，如 安全生产" autocomplete="off">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="filters" id="typeFilters"></div>
  </header>
  <main>
    <div class="stat" id="stat">正在加载题库…</div>
    <div id="list"></div>
    <div class="footer">题库来自：交安复习题全部.docx</div>
  </main>

  <script>
    let docs = [];
    let currentType = '全部';

    const typeFilters = document.getElementById('typeFilters');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const listEl = document.getElementById('list');
    const statEl = document.getElementById('stat');

    function normalize(s) {
      if (!s) return '';
      let out = '';
      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i);
        if (code >= 0xFF01 && code <= 0xFF5E) out += String.fromCharCode(code - 0xFEE0);
        else if (code === 0x3000) out += ' ';
        else out += s[i];
      }
      return out.toLowerCase().replace(/\s+/g, '').trim();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlight(text, q) {
      if (!text) return escapeHtml('');
      if (!q) return escapeHtml(text);
      const orig = Array.from(text);
      const normChars = [];
      const map = [];
      for (let i = 0; i < orig.length; i++) {
        let ch = orig[i];
        const code = ch.charCodeAt(0);
        if (code >= 0xFF01 && code <= 0xFF5E) ch = String.fromCharCode(code - 0xFEE0);
        else if (code === 0x3000) ch = ' ';
        ch = ch.toLowerCase();
        if (/\s/.test(ch)) continue;
        normChars.push(ch);
        map.push(i);
      }
      const norm = normChars.join('');
      const marked = new Set();

      let pos = norm.indexOf(q);
      if (pos >= 0) {
        while (pos !== -1) {
          for (let i = pos; i < pos + q.length; i++) marked.add(map[i]);
          pos = norm.indexOf(q, pos + 1);
        }
      } else {
        // 不连续匹配：把按顺序命中的字符标黄
        const sub = [];
        let ni = 0;
        for (let i = 0; i < normChars.length && ni < q.length; i++) {
          if (normChars[i] === q[ni]) { sub.push(i); ni++; }
        }
        if (ni === q.length) {
          for (const i of sub) marked.add(map[i]);
        } else {
          // 错别字：标黄编辑距离最近的一段
          const maxDist = q.length <= 4 ? 1 : 2;
          let bestStart = -1;
          for (let i = 0; i <= norm.length - q.length; i++) {
            if (levenshtein(q, norm.slice(i, i + q.length)) <= maxDist) { bestStart = i; break; }
          }
          if (bestStart >= 0) {
            for (let i = bestStart; i < bestStart + q.length; i++) marked.add(map[i]);
          }
        }
      }

      let html = '';
      let inMark = false;
      for (let i = 0; i < orig.length; i++) {
        const isMark = marked.has(i);
        if (isMark !== inMark) {
          html += isMark ? '<mark>' : '</mark>';
          inMark = isMark;
        }
        html += escapeHtml(orig[i]);
      }
      if (inMark) html += '</mark>';
      return html;
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      let prev = new Array(n + 1);
      for (let j = 0; j <= n; j++) prev[j] = j;
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) {
          cur[j] = Math.min(
            prev[j] + 1,
            cur[j - 1] + 1,
            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
        prev = cur;
      }
      return prev[n];
    }

    function isSubsequence(needle, haystack) {
      let i = 0;
      for (let j = 0; j < haystack.length && i < needle.length; j++) {
        if (haystack[j] === needle[i]) i++;
      }
      return i === needle.length;
    }

    function fuzzyWindowMatch(q, haystack, maxDist) {
      const len = q.length;
      if (len < 2 || haystack.length < len) return false;
      for (let i = 0; i <= haystack.length - len; i++) {
        if (levenshtein(q, haystack.slice(i, i + len)) <= maxDist) return true;
      }
      return false;
    }

    function scoreDoc(doc, nq) {
      let score = 0;
      const q = (doc.question || '').toLowerCase();
      const text = (doc.text || '').toLowerCase();
      const textCompact = text.replace(/\s+/g, '');
      const pinyin = (doc.pinyin || '').toLowerCase();
      const answerText = (doc.answerText || '').toLowerCase();

      let strong = false;

      if (q === nq) { score += 200; strong = true; }
      else if (q.startsWith(nq)) { score += 120; strong = true; }
      if (text.includes(nq)) { score += 80; strong = true; }
      if (pinyin.includes(nq)) { score += 60; strong = true; }
      if (answerText && answerText.includes(nq)) { score += 20; strong = true; }

      const grams = doc.grams || [];
      for (let i = 0; i < nq.length - 1; i++) {
        const g = nq.slice(i, i + 2);
        if (grams.includes(g)) { score += 15; strong = true; }
      }

      // 不要求完全连续：乱序/错字也能搜到
      if (nq.length >= 2 && isSubsequence(nq, textCompact)) {
        score += 30;
        strong = true;
      }
      // 错别字容错：允许 1~2 个字符差异
      const maxDist = nq.length <= 4 ? 1 : 2;
      if (nq.length >= 2 && fuzzyWindowMatch(nq, textCompact, maxDist)) {
        score += 35;
        strong = true;
      }

      // 必须至少有一个“强命中”才返回，避免只因为一个常见字就显示大量不相关题
      return strong ? score : 0;
    }

    function search() {
      const nq = normalize(searchInput.value);
      if (!nq) {
        // 没有关键字时也要按当前题型筛选
        if (currentType === '全部') return docs;
        return docs.filter(doc => doc.typeName === currentType);
      }
      const results = [];
      for (const doc of docs) {
        if (currentType !== '全部' && doc.typeName !== currentType) continue;
        const score = scoreDoc(doc, nq);
        if (score > 0) results.push({ doc, score });
      }
      results.sort((a, b) => b.score - a.score || a.doc.id.localeCompare(b.doc.id));
      return results.slice(0, 100).map(r => r.doc);
    }

    function toast(msg) {
      let t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.style.cssText = 'position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:99;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1500);
    }

    function renderFilters() {
      const types = ['全部', ...new Set(docs.map(d => d.typeName))].filter(Boolean);
      typeFilters.innerHTML = '';
      for (const t of types) {
        const b = document.createElement('button');
        b.className = 'chip' + (t === currentType ? ' active' : '');
        b.textContent = t;
        b.dataset.type = t;
        b.addEventListener('click', () => {
          currentType = t;
          renderFilters();
          renderList();
        });
        typeFilters.appendChild(b);
      }
    }

    function renderDocCard(doc, q, nested) {
      const isKnowledge = doc.type === 'knowledge';
      const optsHtml = (doc.options || []).map(o => {
        const text = highlight(o.text, q);
        return `<div>${escapeHtml(o.key)}. ${text}</div>`;
      }).join('');
      const ansText = highlight(doc.answerText || '', q);
      const noteHtml = doc.note ? `<div class="note">注：${escapeHtml(doc.note)}</div>` : '';
      const materialHtml = doc.materialText ? (
        isKnowledge
          ? `<div class="case-material">${highlight(doc.materialText, q)}</div>`
          : `<div class="note">背景：${escapeHtml(doc.materialText.slice(0, 120))}${doc.materialText.length > 120 ? '…' : ''}</div>`
      ) : '';
      const cls = nested ? 'card sub-card' : 'card';
      return `<div class="${cls}">
        <div class="card-head">
          <span class="type-tag">${escapeHtml(doc.typeName || '')}${doc.sourceNo ? ' · ' + escapeHtml(doc.sourceNo) : ''}</span>
        </div>
        <div class="q-text">${highlight(doc.question || '', q)}</div>
        ${optsHtml ? `<div class="options">${optsHtml}</div>` : ''}
        ${doc.answerText ? `<div class="answer-card">答案：${ansText}</div>` : ''}
        ${noteHtml}
        ${materialHtml}
      </div>`;
    }

    function renderList() {
      const results = search();
      if (!results.length) {
        listEl.innerHTML = '<div class="empty">未找到题目，试试更短关键词或拼音首字母</div>';
        statEl.textContent = '共 0 条';
        return;
      }
      statEl.textContent = `共 ${results.length} 条`;
      const q = normalize(searchInput.value);

      const items = [];
      const caseSeen = new Set();
      for (const doc of results) {
        if (doc.caseId && doc.caseId !== '') {
          if (!caseSeen.has(doc.caseId)) {
            caseSeen.add(doc.caseId);
            items.push({ type: 'case', caseId: doc.caseId, caseDoc: doc, subs: [doc] });
          } else {
            const item = items.find(x => x.type === 'case' && x.caseId === doc.caseId);
            if (item) item.subs.push(doc);
          }
        } else {
          items.push({ type: 'single', doc });
        }
      }

      let html = '';
      for (const item of items) {
        if (item.type === 'case') {
          const d = item.caseDoc;
          const caseTitleHtml = d.caseTitle ? `<div class="case-title">${highlight(d.caseTitle, q)}</div>` : '';
          const caseMaterialHtml = d.caseMaterial ? `<div class="case-material">${highlight(d.caseMaterial, q)}</div>` : '';
          html += `<div class="card case-card">
            <div class="card-head"><span class="type-tag">案例</span></div>
            ${caseTitleHtml}
            ${caseMaterialHtml}
            ${item.subs.map(sub => renderDocCard(sub, q, true)).join('')}
          </div>`;
        } else {
          html += renderDocCard(item.doc, q, false);
        }
      }

      listEl.innerHTML = html;
    }

    async function loadData() {
      try {
        const res = await fetch('search-index.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('fetch fail ' + res.status);
        const data = await res.json();
        docs = data.docs || [];
        renderFilters();
        renderList();
      } catch (e) {
        statEl.textContent = '加载失败：请通过 HTTP 服务打开本页面，不要直接用 file:// 打开。';
        listEl.innerHTML = '';
      }
    }

    let debounceTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderList, 250);
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') renderList();
    });
    searchBtn.addEventListener('click', renderList);

    loadData();
  </script>
</body>
</html>
