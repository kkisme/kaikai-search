name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Capacitor app from docs
        run: |
          cp -R docs www
          npx cap init "凯凯搜题助手" "com.kkisme.kaikaisearch" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-search-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish current APK to the permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kaikai-search.apk
          git tag -f app-latest "$GITHUB_SHA"
          git push origin refs/tags/app-latest --force
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest kaikai-search.apk --clobber
          else
            gh release create app-latest kaikai-search.apk \
              --title "凯凯搜题助手 Android 最新版" \
              --notes "此安装包由 main 分支自动构建。" \
              --prerelease
          fi
